services:
  # MongoDB local para la memoria de Orfeo
  mongo:
    image: mongo:8
    container_name: orfeo-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"  # 27018 en tu PC (el 27017 ya lo usa tu otro MongoDB)
    volumes:
      - orfeo-mongo-data:/data/db

  # Speaches: voz local (Whisper para oír, Kokoro/Piper para hablar), API compatible con OpenAI.
  # Corre en CPU a propósito: la GPU (8 GB) la usa Ollama.
  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: orfeo-speaches
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      STT_MODEL_TTL: "-1"                # -1 = nunca descargar el modelo de memoria (por defecto: a los 5 min)
      TTS_MODEL_TTL: "-1"
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8        # más rápido y ligero en CPU
      PRELOAD_MODELS: '["Systran/faster-whisper-small","speaches-ai/Kokoro-82M-v1.0-ONNX"]'
      LOG_LEVEL: info
    volumes:
      - orfeo-speaches-cache:/home/ubuntu/.cache/huggingface/hub  # modelos descargados

volumes:
  orfeo-mongo-data:
  orfeo-speaches-cache:
